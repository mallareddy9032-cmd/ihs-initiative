global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: ihs-cloud-engine
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      # Docker Desktop / Linux host-gateway → cloud-engine on the host
      - targets: ['host.docker.internal:8080']
        labels:
          service: ihs-cloud-engine
          sla: sub_5_min
