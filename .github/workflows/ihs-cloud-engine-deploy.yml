# ============================================================================
# FILE: .github/workflows/ihs-cloud-engine-deploy.yml
# CONTEXT: Continuous Integration & Deployment for IHS Cloud Core
# ============================================================================
name: IHS Cloud Engine CI/CD (Production)

on:
  push:
    branches:
      - main
    paths:
      - 'services/cloud-engine/src/**'
      - 'services/cloud-engine/prisma/**'
      - 'services/cloud-engine/Dockerfile'
      - 'services/cloud-engine/package.json'
      - 'services/cloud-engine/package-lock.json'
      - 'services/cloud-engine/tsconfig*.json'
      - '.github/workflows/ihs-cloud-engine-deploy.yml'
  workflow_dispatch:

env:
  AWS_REGION: ap-south-2
  ECR_REPOSITORY: ihs-cloud-engine
  EKS_CLUSTER_NAME: ihs-antp-cluster
  CLOUD_ENGINE_DIR: services/cloud-engine

jobs:
  integration-and-security:
    name: "Code & Security Audit"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/cloud-engine
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/cloud-engine/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Types
        run: npx prisma generate
        env:
          # prisma generate does not need a live DB; provide a stub URL for schema parse
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ihs_ci?schema=public

      - name: Typecheck Cloud Engine
        run: npm run typecheck
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ihs_ci?schema=public

      - name: Execute FSM & State Machine Tests
        run: npm run test:ci

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'services/cloud-engine'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  build-and-push:
    name: "Build Artifact & Push to ECR"
    needs: integration-and-security
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.build-image.outputs.image_uri }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Docker image for IHS Cloud Engine..."
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            -f services/cloud-engine/Dockerfile \
            services/cloud-engine

          echo "Pushing artifact to AWS ECR in ap-south-2..."
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "Published immutable artifact: $IMAGE_URI"

  deploy-to-eks:
    name: "Blue/Green EKS Deployment"
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name "${{ env.EKS_CLUSTER_NAME }}" \
            --region "${{ env.AWS_REGION }}"

      - name: Execute Rolling Update on Kubernetes
        env:
          IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}
        run: |
          if [ -z "$IMAGE_URI" ]; then
            echo "ERROR: IMAGE_URI output from build-and-push is empty."
            exit 1
          fi

          echo "Rolling out $IMAGE_URI to deployment/ihs-cloud-engine (zero-downtime)..."

          # The deployment dynamically pulls the new SHA tag, triggering a zero-downtime rollout
          kubectl set image deployment/ihs-cloud-engine \
            api-container="$IMAGE_URI" \
            -n ihs-production

          # Monitor the rollout status to ensure pods stabilize before reporting success
          kubectl rollout status deployment/ihs-cloud-engine \
            -n ihs-production \
            --timeout=300s

          echo "Rollout complete. Active pods:"
          kubectl get pods -n ihs-production -l app=ihs-cloud-engine -o wide
